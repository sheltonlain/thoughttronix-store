{# ClearableFileInput, restyled: a DaisyUI "remove" checkbox, then the file input. #}
{% if widget.is_initial and not widget.required %}
  <label class="label mb-2 cursor-pointer justify-start gap-3" for="{{ widget.checkbox_id }}">
    <input type="checkbox" name="{{ widget.checkbox_name }}" id="{{ widget.checkbox_id }}" class="checkbox checkbox-sm"{% if widget.attrs.disabled %} disabled{% endif %}{% if widget.attrs.checked %} checked{% endif %} />
    <span>{{ widget.clear_checkbox_label }}</span>
  </label>
{% endif %}
<input type="{{ widget.type }}" name="{{ widget.name }}"{% include "django/forms/widgets/attrs.html" %} />
